<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Mat's Mobile Repair SD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: 
                repeating-linear-gradient(0deg, transparent, transparent 35px, rgba(255,255,255,.1) 35px, rgba(255,255,255,.1) 70px),
                repeating-linear-gradient(90deg, 
                    #B22234 0px, #B22234 153.8px,
                    white 153.8px, white 184.8px,
                    #B22234 184.8px, #B22234 338.6px
                ),
                linear-gradient(180deg, #002868 0%, #002868 50%, #B22234 50%, #B22234 100%);
            background-size: 100% 100%, 100% 100%, 100% 100%;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 30px;
            border-top: 5px solid #B22234;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-container {
            margin-bottom: 20px;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(178, 34, 52, 0.3);
            background: white;
            overflow: hidden;
            border: 3px solid #B22234;
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .business-name {
            font-size: 24px;
            font-weight: bold;
            color: #B22234;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        
        .tagline {
            font-size: 14px;
            color: #002868;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        
        .flag-accent {
            height: 4px;
            background: linear-gradient(90deg, #B22234 0%, #FFFFFF 33%, #002868 66%, #FFFFFF 100%);
            margin: 15px 0;
            border-radius: 2px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #B22234;
            box-shadow: 0 0 0 3px rgba(178, 34, 52, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #B22234 0%, #002868 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(178, 34, 52, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .success-message {
            display: none;
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .error-message {
            display: none;
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .info-box {
            background: linear-gradient(135deg, #f0f4ff 0%, #fff0f5 100%);
            border-left: 4px solid #B22234;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #B22234;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <div class="logo">
                    <img src="https://i.imgur.com/rRFiBmQ.jpeg" alt="Magic Mat's Mobile Repair Logo">
                </div>
            </div>
            <div class="business-name">Magic Mat's Mobile Repair</div>
            <div class="tagline">San Diego - We Come To You!</div>
            <div class="flag-accent"></div>
        </div>
        
        <div class="info-box">
            ℹ️ <strong>Broken down?</strong> Fill out this form and Magic Mat will contact you ASAP to help get you back on the road!
        </div>
        
        <div class="success-message" id="successMsg">
            ✅ Request sent! Magic Mat will contact you soon!
        </div>
        
        <div class="error-message" id="errorMsg"></div>
        
        <form id="repairForm">
            <div class="form-group">
                <label for="name">Your Name *</label>
                <input type="text" id="name" name="name" required placeholder="John Smith">
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number or Contact *</label>
                <input type="tel" id="phone" name="phone" required placeholder="(619) 555-1234 or @instagram">
            </div>
            
            <div class="form-group">
                <label for="location">Current Location *</label>
                <input type="text" id="location" name="location" required placeholder="Street address or intersection in San Diego">
            </div>
            
            <div class="form-group">
                <label for="year">Vehicle Year *</label>
                <input type="number" id="year" name="year" required placeholder="2020" min="1990" max="2030">
            </div>
            
            <div class="form-group">
                <label for="make">Vehicle Make *</label>
                <input type="text" id="make" name="make" required placeholder="Honda">
            </div>
            
            <div class="form-group">
                <label for="model">Vehicle Model *</label>
                <input type="text" id="model" name="model" required placeholder="Civic">
            </div>
            
            <div class="form-group">
                <label for="problem">What's Wrong? *</label>
                <textarea id="problem" name="problem" required placeholder="Engine won't start, weird noise, check engine light, etc."></textarea>
            </div>
            
            <div class="loading" id="loading">Sending your request...</div>
            
            <button type="submit">📍 Send Repair Request</button>
        </form>
    </div>
    
    <script>
        document.getElementById('repairForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const loading = document.getElementById('loading');
            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');
            
            loading.style.display = 'block';
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            
            const formData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                location: document.getElementById('location').value,
                year: document.getElementById('year').value,
                make: document.getElementById('make').value,
                model: document.getElementById('model').value,
                problem: document.getElementById('problem').value
            };
            
            try {
                // For now, save to localStorage (local storage on phone)
                let requests = JSON.parse(localStorage.getItem('repairRequests') || '[]');
                requests.push({
                    ...formData,
                    timestamp: new Date().toLocaleString(),
                    id: Date.now()
                });
                localStorage.setItem('repairRequests', JSON.stringify(requests));
                
                // TODO: Send SMS notification to mechanic
                console.log('Repair request:', formData);
                
                loading.style.display = 'none';
                successMsg.style.display = 'block';
                document.getElementById('repairForm').reset();
                
                // Hide success message after 3 seconds
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 3000);
                
            } catch (error) {
                loading.style.display = 'none';
                errorMsg.textContent = '❌ Error sending request. Please try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
