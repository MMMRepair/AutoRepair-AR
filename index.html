<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMMRepairSD - Mobile Auto Repair</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #002868 0%, #002868 50%, #B22234 50%, #B22234 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 30px;
            border-top: 5px solid #B22234;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 10px;
            border: 3px solid #B22234;
            overflow: hidden;
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .business-name {
            font-size: 24px;
            font-weight: bold;
            color: #B22234;
            margin-bottom: 5px;
        }
        
        .tagline {
            font-size: 14px;
            color: #002868;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: #333;
        }

        select {
            background-color: white;
            cursor: pointer;
            appearance: auto;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #B22234;
            box-shadow: 0 0 0 3px rgba(178, 34, 52, 0.1);
        }

        input::placeholder, select::placeholder {
            color: #999;
        }

        option {
            color: #333;
            background: white;
        }

        option:disabled {
            color: #999;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .location-wrapper {
            display: flex;
            gap: 10px;
        }
        
        #location {
            flex: 1;
        }
        
        .location-btn {
            padding: 12px 15px;
            background: #002868;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .location-btn:hover {
            background: #B22234;
        }
        
        .map-preview {
            display: none;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .map-preview.show {
            display: block;
        }
        
        .map-preview img {
            width: 100%;
            height: auto;
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #B22234 0%, #002868 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        button[type="submit"]:disabled {
            background: #4caf50;
            cursor: not-allowed;
        }
        
        .success-message {
            display: none;
            background: #4caf50;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .success-message h3 {
            margin-bottom: 10px;
        }
        
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #B22234;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
        }

        select:disabled {
            background-color: #f5f5f5;
            color: #999;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="https://i.imgur.com/rRFiBmQ.jpeg" alt="MMMRepairSD Logo">
            </div>
            <div class="business-name">MMMRepairSD</div>
            <div class="tagline">San Diego - We Come To You!</div>
        </div>
        
        <div class="info-box">
            <strong>Broken down?</strong> Fill out this form and a roadside service technician will contact you ASAP!
        </div>
        
        <div class="success-message" id="successMsg">
            <h3>Request Confirmed!</h3>
            <p>A roadside service technician will contact you as soon as possible with verification and your estimated time of arrival.</p>
        </div>
        
        <form id="repairForm">
            <div class="form-group">
                <label for="name">Your Name *</label>
                <input type="text" id="name" required placeholder="John Smith">
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" required placeholder="(619) 555-1234">
            </div>
            
            <div class="form-group">
                <label for="location">Current Location *</label>
                <div class="location-wrapper">
                    <input type="text" id="location" required placeholder="San Diego address">
                    <button type="button" class="location-btn" id="locBtn">Use Location</button>
                </div>
                <div class="map-preview" id="mapPreview"></div>
            </div>
            
            <div class="form-group">
                <label for="year">Vehicle Year *</label>
                <select id="year" required>
                    <option value="">Select Year</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="make">Vehicle Make *</label>
                <select id="make" required>
                    <option value="">Select Make</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="model">Vehicle Model *</label>
                <select id="model" required disabled>
                    <option value="">Select Model</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="problem">What's Wrong? *</label>
                <textarea id="problem" required placeholder="Engine won't start, weird noise, etc."></textarea>
            </div>
            
            <button type="submit" id="submitBtn">Request Service</button>
        </form>
    </div>
    
    <script>
        const currentYear = new Date().getFullYear();
        const yearSelect = document.getElementById('year');
        const makeSelect = document.getElementById('make');
        const modelSelect = document.getElementById('model');
        const form = document.getElementById('repairForm');
        const successMsg = document.getElementById('successMsg');
        const submitBtn = document.getElementById('submitBtn');
        const locBtn = document.getElementById('locBtn');

        const vehicleDatabase = {
            'Toyota': ['Camry', 'Corolla', 'RAV4', 'Tacoma', 'Tundra', 'Highlander', 'Prius', 'Sienna', '4Runner'],
            'Honda': ['Civic', 'Accord', 'CR-V', 'Pilot', 'Odyssey', 'Fit', 'Ridgeline'],
            'Ford': ['Mustang', 'F-150', 'Focus', 'Fusion', 'Edge', 'Escape', 'Explorer', 'Ranger'],
            'Chevrolet': ['Silverado', 'Malibu', 'Impala', 'Equinox', 'Blazer', 'Traverse', 'Colorado'],
            'RAM': ['1500', '2500', '3500'],
            'Dodge': ['Durango', 'Charger', 'Challenger', 'Journey'],
            'BMW': ['3 Series', '5 Series', 'X3', 'X5', 'Z4'],
            'Mercedes-Benz': ['C-Class', 'E-Class', 'GLC', 'GLE'],
            'Hyundai': ['Elantra', 'Sonata', 'Santa Fe', 'Tucson', 'Accent'],
            'Kia': ['Optima', 'Sorento', 'Sportage', 'Forte'],
            'Nissan': ['Altima', 'Maxima', 'Rogue', 'Murano', 'Sentra'],
            'Mazda': ['Mazda3', 'Mazda6', 'CX-5', 'CX-9'],
            'Volkswagen': ['Jetta', 'Passat', 'Golf', 'Tiguan', 'Beetle'],
            'Subaru': ['Outback', 'Legacy', 'Impreza', 'Crosstrek', 'Forester'],
            'Jeep': ['Wrangler', 'Cherokee', 'Grand Cherokee', 'Compass'],
            'GMC': ['Sierra', 'Terrain', 'Acadia', 'Yukon'],
            'Lexus': ['IS', 'ES', 'RX', 'NX', 'LX'],
            'Infiniti': ['Q50', 'Q60', 'QX50', 'QX60'],
            'Acura': ['TLX', 'RDX', 'MDX'],
            'Tesla': ['Model 3', 'Model S', 'Model X', 'Model Y']
        };

        // Fill year dropdown (1930 to current)
        for (let y = currentYear; y >= 1930; y--) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.text = y;
            yearSelect.appendChild(opt);
        }

        // Fill make dropdown
        const allMakes = Object.keys(vehicleDatabase).sort();
        allMakes.forEach(make => {
            const opt = document.createElement('option');
            opt.value = make;
            opt.text = make;
            makeSelect.appendChild(opt);
        });

        // When make is selected, populate models
        makeSelect.addEventListener('change', function() {
            modelSelect.innerHTML = '<option value="">Select Model</option>';
            
            if (this.value === '') {
                modelSelect.disabled = true;
            } else {
                modelSelect.disabled = false;
                vehicleDatabase[this.value].forEach(model => {
                    const opt = document.createElement('option');
                    opt.value = model;
                    opt.text = model;
                    modelSelect.appendChild(opt);
                });
            }
        });

        // Location button
        locBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (!navigator.geolocation) {
                alert('Location not supported');
                return;
            }
            navigator.geolocation.getCurrentPosition(function(pos) {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                document.getElementById('location').value = lat.toFixed(4) + ', ' + lng.toFixed(4);
                const mapImg = document.getElementById('mapPreview');
                mapImg.innerHTML = '<img src="https://static-maps.yandex.ru/1.x/?ll=' + lng + ',' + lat + '&size=500,300&z=16&l=map&pt=' + lng + ',' + lat + ',pm2lbm" alt="map">';
                mapImg.classList.add('show');
            });
        });
        
        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.textContent = 'Request Sent';
            submitBtn.disabled = true;
            successMsg.style.display = 'block';
            form.style.display = 'none';
        });
    </script>
</body>
</html>
